ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Limite conservador para la instancia gratuita de 512 MB.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    ServerLimit 5
    MaxRequestWorkers 5
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # El PHP puede incluir estos archivos; HTTP nunca debe servirlos.
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>
    <Directory /var/www/html/scripts>
        Require all denied
    </Directory>
    <LocationMatch "(?i)^/(includes|scripts|database|deploy|documentacion|tests)(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)(^\.|^(Dockerfile|README\.md|probar_conexion\.php|verificar\.php)$|\.(sql|ini|conf|log|bak|old|ya?ml|ps1|sh|pem|key)$)">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    # No registrar cookies, cuerpos, query strings, IP ni cabeceras de acceso.
    LogFormat "%m %U %>s %b" cvs
    CustomLog /proc/self/fd/1 cvs
</VirtualHost>
